[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "composio-toolkit-research"
version = "0.1.0"
description = "Evidence-backed research pipeline for evaluating agent-toolkit buildability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "lxml>=5,<7",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/composio_research"]
